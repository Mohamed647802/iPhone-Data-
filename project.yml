name: DataMeter
options:
  bundleIdPrefix: com.mohamed647802
  deploymentTarget:
    iOS: "15.0"
targets:
  DataMeter:
    type: application
    platform: iOS
    sources:
      - DataMeterApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mohamed647802.datameter
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "عداد البيانات"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
